<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servo Controller</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="Ringkasan perangkat">
        <div>
          <p class="eyebrow">IoT Dashboard</p>
          <h1>Servo Controller</h1>
        </div>
        <div class="connection-pill" id="connectionPill">
          <span class="dot"></span>
          <span id="connectionText">Checking...</span>
        </div>
      </section>

      <section class="layout">
        <article class="panel control-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Servo</p>
              <h2>Angle Control</h2>
            </div>
            <output class="angle-readout" id="angleReadout">90&deg;</output>
          </div>

          <input
            class="servo-slider"
            type="range"
            min="0"
            max="180"
            value="90"
            id="servoSlider"
            aria-label="Servo angle"
          >

          <div class="quick-actions" aria-label="Pilihan sudut cepat">
            <button type="button" data-angle="0">0&deg;</button>
            <button type="button" data-angle="45">45&deg;</button>
            <button type="button" data-angle="90">90&deg;</button>
            <button type="button" data-angle="135">135&deg;</button>
            <button type="button" data-angle="180">180&deg;</button>
          </div>
        </article>

        <aside class="panel status-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">MQTT</p>
              <h2>Status</h2>
            </div>
            <button class="icon-button" type="button" id="refreshButton" title="Refresh status" aria-label="Refresh status">
              &#8635;
            </button>
          </div>

          <dl class="status-grid">
            <div>
              <dt>Angle</dt>
              <dd id="statusAngle">-</dd>
            </div>
            <div>
              <dt>WiFi</dt>
              <dd id="statusWifi">-</dd>
            </div>
            <div>
              <dt>Topic</dt>
              <dd id="statusIp">-</dd>
            </div>
          </dl>
        </aside>

        <article class="panel settings-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Settings</p>
              <h2>MQTT Topic</h2>
            </div>
          </div>

          <form id="settingsForm" class="settings-form">
            <label for="mqttTopic">Device Topic</label>
            <div class="input-row">
              <input
                type="text"
                id="mqttTopic"
                name="mqttTopic"
                placeholder="mitschess/mitesptest/servo"
                autocomplete="off"
              >
              <button type="submit">Save</button>
            </div>
            <p class="hint" id="settingsHint">Topic harus sama dengan kode ESP32.</p>
          </form>
        </article>
      </section>
    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
